services:
  db:
    image: postgres:15-alpine
    container_name: kapuruka-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kapuruka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kapuruka"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migration
    container_name: kapuruka-db-migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kapuruka?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/kapuruka?schema=public
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: kapuruka-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
