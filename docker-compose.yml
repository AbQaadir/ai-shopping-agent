version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: kapuruka-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kapuruka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: kapuruka-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
